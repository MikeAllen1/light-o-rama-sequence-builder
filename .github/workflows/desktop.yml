name: Desktop app

# Builds the desktop app for Windows (installer and portable zip), Linux (AppImage) and
# macOS (Apple silicon .app in a zip), each with FFmpeg inside, checks every build with
# the app's own self-test, and keeps them as downloadable artifacts. A tag like v0.2.0
# also puts them on its GitHub release (made here when the tag has none yet).

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42/ffmpeg-n9.0.2-48-gd4070a14ce-win64-lgpl-9.0.zip
  FFMPEG_SHA256: fc9fbc4615986fdfea41904396074fe8fc0ba061cd974f63bd301cc5e1949a35
  FFMPEG_LINUX_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42/ffmpeg-n9.0.2-48-gd4070a14ce-linux64-lgpl-9.0.tar.xz
  FFMPEG_LINUX_SHA256: f95f189668268b8ec2c8acce6ea034cf36f93ba99a09f2654d0cfbd89c5c0ebd
  # macOS: FFmpeg is built from this release tag, checked against its commit.
  FFMPEG_MAC_TAG: n7.1.2
  FFMPEG_MAC_COMMIT: f893221c8d89cb798b829bebe71d55e1a3f242fd
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1

jobs:
  windows-app:
    name: Build and self-test the Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Sync locked environment with the desktop build tools
        run: uv sync --locked --extra desktop

      - name: Fetch the pinned FFmpeg build
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg checksum mismatch: $hash" }
          $unpacked = Join-Path $env:RUNNER_TEMP "ffmpeg-unpacked"
          Expand-Archive $zip -DestinationPath $unpacked
          $bundle = Join-Path $env:RUNNER_TEMP "ffmpeg-bundle"
          New-Item -ItemType Directory $bundle | Out-Null
          $root = Get-ChildItem $unpacked -Directory | Select-Object -First 1
          Copy-Item (Join-Path $root.FullName "bin\ffmpeg.exe") $bundle
          Copy-Item (Join-Path $root.FullName "LICENSE.txt") (Join-Path $bundle "FFmpeg-LICENSE.txt")
          "LOR_FFMPEG_DIR=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the app with PyInstaller
        run: uv run --no-sync pyinstaller packaging/lor_sequencer.spec --noconfirm

      - name: Self-test the built app
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "self-test.json"
          $exe = "dist\LOR Sequencer\LOR Sequencer.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", "`"$result`"") -Wait -PassThru
          Get-Content $result
          $report = Get-Content $result | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $report.ok) { throw "The app's self-test failed" }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          $version = (uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Build the portable zip
        shell: pwsh
        # The same self-tested app folder, for PCs that block installers: unzip and run.
        run: |
          $version = (uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          $folder = "dist\LOR Sequencer"
          @(
            "LOR Sequencer $version, portable",
            "",
            "Unzip this folder anywhere you can write to (for example Documents), then",
            "double-click 'LOR Sequencer.exe'. Nothing is installed. To remove it, delete",
            "the folder. Settings and remembered requirements are kept in",
            "%LOCALAPPDATA%\lor-sequence-builder.",
            "",
            "Free to use, not to sell. See LICENSE.txt."
          ) | Set-Content -Path (Join-Path $folder "README.txt") -Encoding utf8
          Copy-Item LICENSE (Join-Path $folder "LICENSE.txt")
          $zip = "dist\LOR-Sequencer-Portable-$version.zip"
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem dist\*.zip | Format-Table Name, Length

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LOR-Sequencer-Windows-installer
          path: dist/LOR-Sequencer-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Keep the portable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LOR-Sequencer-Windows-portable
          path: dist/LOR-Sequencer-Portable-*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux-app:
    name: Build and self-test the Linux app
    # The oldest supported runner, so the AppImage runs on older distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv and the AppImage checker
        run: |
          python -m pip install uv==0.10.0
          sudo apt-get update -q
          sudo apt-get install -y -q desktop-file-utils

      - name: Sync locked environment with the desktop build tools
        run: uv sync --locked --extra desktop

      - name: Fetch the pinned FFmpeg build and appimagetool
        run: |
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl --fail --location --silent --show-error -o "$archive" "$FFMPEG_LINUX_URL"
          echo "$FFMPEG_LINUX_SHA256  $archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/ffmpeg-unpacked" "$RUNNER_TEMP/ffmpeg-bundle"
          tar -xf "$archive" -C "$RUNNER_TEMP/ffmpeg-unpacked"
          root="$(find "$RUNNER_TEMP/ffmpeg-unpacked" -mindepth 1 -maxdepth 1 -type d | head -1)"
          cp "$root/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-bundle/"
          cp "$root/LICENSE.txt" "$RUNNER_TEMP/ffmpeg-bundle/FFmpeg-LICENSE.txt"
          echo "LOR_FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-bundle" >> "$GITHUB_ENV"
          tool="$RUNNER_TEMP/appimagetool"
          curl --fail --location --silent --show-error -o "$tool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $tool" | sha256sum --check -
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Build the app with PyInstaller
        run: uv run --no-sync pyinstaller packaging/lor_sequencer.spec --noconfirm

      - name: Build the AppImage
        run: |
          version="$(uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          packaging/linux/build_appimage.sh "$version" "$APPIMAGETOOL"

      - name: Self-test the AppImage
        run: |
          result="$RUNNER_TEMP/self-test.json"
          APPIMAGE_EXTRACT_AND_RUN=1 dist/LOR-Sequencer-*-x86_64.AppImage --self-test "$result"
          cat "$result"
          python -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))['ok'] else 1)" "$result"

      - name: Keep the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LOR-Sequencer-Linux-AppImage
          path: dist/LOR-Sequencer-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos-app:
    name: Build and self-test the macOS app
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Sync locked environment with the desktop build tools
        run: uv sync --locked --extra desktop

      - name: Build FFmpeg from its pinned release
        run: |
          src="$RUNNER_TEMP/ffmpeg-src"
          git clone --quiet --depth 1 --branch "$FFMPEG_MAC_TAG" https://github.com/FFmpeg/FFmpeg "$src"
          test "$(git -C "$src" rev-parse HEAD)" = "$FFMPEG_MAC_COMMIT"
          packaging/macos/build_ffmpeg.sh "$src" "$RUNNER_TEMP/ffmpeg-built"
          mkdir "$RUNNER_TEMP/ffmpeg-bundle"
          cp "$RUNNER_TEMP/ffmpeg-built/bin/ffmpeg" "$RUNNER_TEMP/ffmpeg-bundle/"
          cp "$src/COPYING.LGPLv2.1" "$RUNNER_TEMP/ffmpeg-bundle/FFmpeg-LICENSE.txt"
          "$RUNNER_TEMP/ffmpeg-bundle/ffmpeg" -version | head -1
          echo "LOR_FFMPEG_DIR=$RUNNER_TEMP/ffmpeg-bundle" >> "$GITHUB_ENV"

      - name: Build the app with PyInstaller
        run: uv run --no-sync pyinstaller packaging/lor_sequencer.spec --noconfirm

      - name: Self-test the built app
        run: |
          result="$RUNNER_TEMP/self-test.json"
          "dist/LOR Sequencer.app/Contents/MacOS/LOR Sequencer" --self-test "$result"
          cat "$result"
          python -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))['ok'] else 1)" "$result"

      - name: Zip the app
        run: |
          version="$(uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ditto -c -k --keepParent "dist/LOR Sequencer.app" "dist/LOR-Sequencer-macOS-$version.zip"
          ls -l dist/*.zip

      - name: Keep the macOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LOR-Sequencer-macOS
          path: dist/LOR-Sequencer-macOS-*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish the installer on the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-app, linux-app, macos-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases

      - name: Download the installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LOR-Sequencer-Windows-installer
          path: installer

      - name: Download the portable zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LOR-Sequencer-Windows-portable
          path: installer

      - name: Download the Linux AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LOR-Sequencer-Linux-AppImage
          path: installer

      - name: Download the macOS app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LOR-Sequencer-macOS
          path: installer

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release drafted in the GitHub page gets the installer added; a bare tag gets a
        # new release. Each file is also attached under a name without the version, so
        # .../releases/latest/download/LOR-Sequencer-Setup.exe always downloads the
        # newest installer directly (the README and the release notes link there).
        run: |
          version="${TAG#v}"
          version="${version#.}"
          notes="docs/releases/v$version.md"
          cp installer/LOR-Sequencer-Setup-*.exe installer/LOR-Sequencer-Setup.exe
          cp installer/LOR-Sequencer-Portable-*.zip installer/LOR-Sequencer-Portable.zip
          cp installer/LOR-Sequencer-*-x86_64.AppImage installer/LOR-Sequencer-x86_64.AppImage
          cp installer/LOR-Sequencer-macOS-*.zip installer/LOR-Sequencer-macOS.zip
          files="installer/*.exe installer/*.zip installer/*.AppImage"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
            body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            if [ -z "$body" ] && [ -f "$notes" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
          else
            if [ -f "$notes" ]; then
              gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --title "LOR Sequencer $version" --notes-file "$notes"
            else
              gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --title "LOR Sequencer $version" --notes "Windows: download LOR-Sequencer-Setup.exe and double-click it. macOS: LOR-Sequencer-macOS.zip. Linux: LOR-Sequencer-x86_64.AppImage. Ignore the Source code files: they are for programmers."
            fi
          fi
