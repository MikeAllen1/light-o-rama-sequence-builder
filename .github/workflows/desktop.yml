name: Desktop app

# Builds the Windows desktop app (PyInstaller + bundled FFmpeg + Inno Setup), checks the
# built app with its own self-test, and keeps the installer as a downloadable artifact.
# A tag like v0.2.0 also puts the installer on its GitHub release (made here when the
# tag has none yet).

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42/ffmpeg-n9.0.2-48-gd4070a14ce-win64-lgpl-9.0.zip
  FFMPEG_SHA256: fc9fbc4615986fdfea41904396074fe8fc0ba061cd974f63bd301cc5e1949a35

jobs:
  windows-app:
    name: Build and self-test the Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Sync locked environment with the desktop build tools
        run: uv sync --locked --extra desktop

      - name: Fetch the pinned FFmpeg build
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg checksum mismatch: $hash" }
          $unpacked = Join-Path $env:RUNNER_TEMP "ffmpeg-unpacked"
          Expand-Archive $zip -DestinationPath $unpacked
          $bundle = Join-Path $env:RUNNER_TEMP "ffmpeg-bundle"
          New-Item -ItemType Directory $bundle | Out-Null
          $root = Get-ChildItem $unpacked -Directory | Select-Object -First 1
          Copy-Item (Join-Path $root.FullName "bin\ffmpeg.exe") $bundle
          Copy-Item (Join-Path $root.FullName "LICENSE.txt") (Join-Path $bundle "FFmpeg-LICENSE.txt")
          "LOR_FFMPEG_DIR=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the app with PyInstaller
        run: uv run --no-sync pyinstaller packaging/lor_sequencer.spec --noconfirm

      - name: Self-test the built app
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "self-test.json"
          $exe = "dist\LOR Sequencer\LOR Sequencer.exe"
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", "`"$result`"") -Wait -PassThru
          Get-Content $result
          $report = Get-Content $result | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $report.ok) { throw "The app's self-test failed" }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          $version = (uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Keep the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LOR-Sequencer-Windows-installer
          path: dist/LOR-Sequencer-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the installer on the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: LOR-Sequencer-Windows-installer
          path: installer

      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release drafted in the GitHub page gets the installer added; a bare tag gets a
        # new release.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" installer/*.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" installer/*.exe --repo "$GITHUB_REPOSITORY" --title "LOR Sequencer $TAG" --notes "Windows installer for LOR Sequencer $TAG. Download LOR-Sequencer-Setup-*.exe and run it; no administrator rights are needed."
          fi
