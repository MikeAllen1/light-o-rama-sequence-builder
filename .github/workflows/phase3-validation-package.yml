name: Phase 3 Validation Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-validation-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Generate ready-to-open S6 test ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.0"

      - name: Install locked project environment
        run: uv sync --locked

      - name: Generate and validate Phase 3 package
        run: uv run --no-sync python scripts/build_phase3_validation.py --output dist/Phase3-S6-Validation.zip

      - name: Upload test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Phase3-S6-Validation
          path: dist/Phase3-S6-Validation.zip
          retention-days: 30
          if-no-files-found: error
