name: Phase 3 Validation Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-validation-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Generate ready-to-open S6 test ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.0"

      - name: Install locked project environment
        run: uv sync --locked

      - name: Generate and validate Phase 3 package
        run: uv run --no-sync python scripts/build_phase3_validation.py --output dist/Phase3-S6-Validation.zip

      - name: Upload test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Phase3-S6-Validation
          path: dist/Phase3-S6-Validation.zip
          retention-days: 30
          if-no-files-found: error
