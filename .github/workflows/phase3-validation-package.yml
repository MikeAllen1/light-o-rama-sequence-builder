name: Phase 3 Validation Package

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/phase3-validation-package.yml"
      - "scripts/build_phase3_validation.py"
      - "src/lor_sequence_builder/**"
      - "tests/fixtures/s6_revision_56_independent_template.loredit.gz.b64"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/phase3-validation-package.yml"
      - "scripts/build_phase3_validation.py"
      - "src/lor_sequence_builder/**"
      - "tests/fixtures/s6_revision_56_independent_template.loredit.gz.b64"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-validation-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Generate ready-to-open S6 test ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install locked project environment
        run: uv sync --locked

      - name: Generate and validate Phase 3 package
        run: uv run --no-sync python scripts/build_phase3_validation.py --output dist/Phase3-S6-Validation.zip

      - name: Upload test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Phase3-S6-Validation
          path: dist/Phase3-S6-Validation.zip
          if-no-files-found: error
          retention-days: 90
