name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-compatibility:
    name: Windows compatibility tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ensure FFmpeg is available
        run: choco install ffmpeg --version=9.0.2 --yes --no-progress

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Check browser workspace JavaScript syntax
        run: node --check src/lor_sequence_builder/web/app.js

      - name: Run tests
        run: uv run --no-sync --with pytest==9.2.0 python -m pytest

  quality:
    name: Tests, lint, types, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned FFmpeg 9.0.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-linux64-lgpl.tar.xz"
          install_dir="$RUNNER_TEMP/ffmpeg"
          curl --fail --location --silent --show-error \
            "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42/ffmpeg-n9.0.2-48-gd4070a14ce-linux64-lgpl-9.0.tar.xz" \
            --output "$archive"
          echo "f95f189668268b8ec2c8acce6ea034cf36f93ba99a09f2654d0cfbd89c5c0ebd  $archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
          ffmpeg_bin="$(find "$install_dir" -type f -name ffmpeg -print -quit)"
          test -n "$ffmpeg_bin"
          chmod +x "$ffmpeg_bin"
          echo "$(dirname "$ffmpeg_bin")" >> "$GITHUB_PATH"
          "$ffmpeg_bin" -version

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Install Playwright Chromium
        run: uv run --no-sync --with playwright==1.56.0 python -m playwright install chromium --with-deps

      - name: Run tests
        run: uv run --no-sync --with pytest==9.2.0 --with playwright==1.56.0 --with ruff==0.17.4 --with mypy==1.18.2 --with pip-audit==2.10.1 --with types-defusedxml==0.7.0.20260504 --with types-PyYAML==6.0.12.20260906 python -m pytest

      - name: Check lint
        run: uv run --no-sync --with pytest==9.2.0 --with ruff==0.17.4 --with mypy==1.18.2 --with pip-audit==2.10.1 --with types-defusedxml==0.7.0.20260504 --with types-PyYAML==6.0.12.20260906 ruff check .

      - name: Check types (strict)
        run: uv run --no-sync --with pytest==9.2.0 --with ruff==0.17.4 --with mypy==1.18.2 --with pip-audit==2.10.1 --with types-defusedxml==0.7.0.20260504 --with types-PyYAML==6.0.12.20260906 mypy --strict src tests

      - name: Build wheel and verify browser assets
        run: |
          uv build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"Expected one wheel, found {len(wheels)}"
          expected = {
              "lor_sequence_builder/web/index.html",
              "lor_sequence_builder/web/app.js",
              "lor_sequence_builder/web/app.css",
          }
          with ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          missing = expected - packaged
          assert not missing, f"Wheel is missing browser assets: {sorted(missing)}"
          print(f"Verified browser assets in {wheels[0].name}")
          PY

      - name: Audit installed dependencies
        run: uv run --no-sync --with pytest==9.2.0 --with ruff==0.17.4 --with mypy==1.18.2 --with pip-audit==2.10.1 --with types-defusedxml==0.7.0.20260504 --with types-PyYAML==6.0.12.20260906 --with setuptools==84.1.0 pip-audit --skip-editable

  optional-dependency-audit:
    name: Audit optional audio dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Export optional dependency graph
        run: uv export --locked --extra vocals --extra lyrics --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/optional-requirements.txt"

      - name: Audit optional dependency graph
        run: uv run --no-sync --with pip-audit==2.10.1 pip-audit --strict --requirement "$RUNNER_TEMP/optional-requirements.txt"

