name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-compatibility:
    name: Windows compatibility tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    timeout-minutes: 20
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure FFmpeg is available
        run: choco install ffmpeg --version=9.0.2 --yes --no-progress

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.0"

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync --with-requirements requirements-dev.txt python -m pytest

  quality:
    name: Tests, lint, types, and dependency audit (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned FFmpeg 9.0.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-linux64-lgpl.tar.xz"
          install_dir="$RUNNER_TEMP/ffmpeg"
          curl --fail --location --silent --show-error \
            "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-09-12-42/ffmpeg-n9.0.2-48-gd4070a14ce-linux64-lgpl-9.0.tar.xz" \
            --output "$archive"
          echo "f95f189668268b8ec2c8acce6ea034cf36f93ba99a09f2654d0cfbd89c5c0ebd  $archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xJf "$archive" --strip-components=1 -C "$install_dir"
          ffmpeg_bin="$(find "$install_dir" -type f -name ffmpeg -print -quit)"
          test -n "$ffmpeg_bin"
          chmod +x "$ffmpeg_bin"
          echo "$(dirname "$ffmpeg_bin")" >> "$GITHUB_PATH"
          "$ffmpeg_bin" -version

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.0"

      - name: Sync locked project environment
        run: uv sync --locked

      - name: Run tests with branch coverage
        run: uv run --no-sync --with-requirements requirements-dev.txt coverage run --branch --source=lor_sequence_builder -m pytest

      - name: Report coverage
        run: uv run --no-sync --with-requirements requirements-dev.txt coverage report --show-missing

      - name: Check lint
        run: uv run --no-sync --with-requirements requirements-dev.txt ruff check .

      - name: Check types (strict)
        run: uv run --no-sync --with-requirements requirements-dev.txt mypy --strict src tests

      - name: Prepare dependency audit input
        run: mkdir -p dist

      - name: Export locked production dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file dist/requirements-production.txt
      - name: Audit production dependencies
        run: uv tool run --from pip-audit==2.10.1 pip-audit -r dist/requirements-production.txt

      - name: Validate Phase 3 package build
        run: uv run --no-sync python scripts/build_phase3_validation.py --output dist/Phase3-S6-Validation.zip
