[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "light-o-rama-sequence-builder"
version = "0.1.0"
license = "MIT"
description = "A display-independent Light-O-Rama S6 sequence builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1,<0.8"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
  "mypy==1.18.2",
  "pip-audit==2.10.1",
  "coverage==7.13.3",
  "types-defusedxml==0.7.0.20260504",
]

[project.scripts]
lor-sequence-builder = "lor_sequence_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "I", "B", "UP", "S", "SIM", "RUF"]


[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "E501"]
"tests/**/*.py" = ["S101", "E501"]
"src/lor_sequence_builder/audio_analysis.py" = ["E501"]
"src/lor_sequence_builder/audio_plot.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
