[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light-o-rama-sequence-builder"
version = "0.1.0"
description = "A display-independent Light-O-Rama S6 sequence builder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "librosa>=0.11,<2",
    "numpy>=2,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
lor-sequence-builder = "lor_sequence_builder.cli:main"
lor-sequence-ui = "lor_sequence_builder.ui_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lor_sequence_builder.rules" = ["*.yaml"]
"lor_sequence_builder" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

