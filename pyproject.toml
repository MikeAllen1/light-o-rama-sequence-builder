[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light-o-rama-sequence-builder"
version = "0.1.0"
description = "A display-independent Light-O-Rama S6 sequence builder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1,<0.8"]

[project.scripts]
lor-sequence-builder = "lor_sequence_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
