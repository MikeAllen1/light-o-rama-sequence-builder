[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light-o-rama-sequence-builder"
version = "0.1.0"
description = "A display-independent Light-O-Rama S6 sequence builder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "librosa>=0.11,<2",
    "numpy>=2,<3",
    "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
# Optional on-PC vocal separation for singing faces. Large (PyTorch); install
# with `uv sync --extra vocals`. Without it, pass a vocals-only file instead.
vocals = [
    "audio-separator[cpu]==0.48.0",
    "audioread>=3.0.1,<4",
]

# Optional offline lyric transcription (word timings, always unverified). Install
# with `uv sync --extra lyrics`; LRC/SRT/VTT import needs nothing extra.
lyrics = [
    "faster-whisper==1.2.1",
]

# Building the Windows desktop app (see packaging/). Not needed to run from source.
desktop = [
    "pywebview==6.2.1",
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
]

[project.scripts]
lor-sequence-builder = "lor_sequence_builder.cli:main"
lor-sequence-ui = "lor_sequence_builder.ui_server:main"
lor-sequencer = "lor_sequence_builder.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lor_sequence_builder.rules" = ["*.yaml"]
"lor_sequence_builder" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Optional add-ons (vocal separation, lyric transcription, the desktop window); usually
# not installed.
module = ["audio_separator.*", "faster_whisper.*", "webview.*", "webview"]
ignore_missing_imports = true

