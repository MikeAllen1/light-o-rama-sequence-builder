# Built-in rules, applied to every display before any user profile.
#
# A user profile can change a rule's severity (error, warning, off) and its
# settings by repeating the rule id under `rules:`. The first three rules
# protect the sequence file itself and cannot be relaxed.
#
# Rules about a kind of prop (faces, falls, chases) apply only when the preview
# has that kind of prop; otherwise they report "not applicable", never "passed".
schema_version: rules-1.0
name: Built-in rules
rules:
  effects_well_formed:
    severity: error
  known_props_and_channels:
    severity: error
  no_overlapping_effects:
    severity: error
  movements_complete:
    severity: error
  chases_follow_layout:
    severity: error
  falls_go_down:
    severity: error
  face_outline_with_mouth:
    severity: error
    # Face parts are recognized by these words in the prop name.
    outline_names: [outline]
    mouth_names: [mouth, lips, mustache, moustache]
  mouths_only_during_vocals:
    severity: error
    mouth_names: [mouth, lips, mustache, moustache]
    # A mouth part named like this is the resting (closed) position; it may stay
    # on with the face when nobody is singing.
    rest_names: [closed, close, shut, rest, down]
  single_color_only_where_possible:
    severity: error
  motion_stops_at_hard_stops:
    severity: error
  not_everything_at_once:
    severity: warning
    # Warn when at least this share of channels is on for longer than max_seconds.
    max_share: 0.9
    max_seconds: 8
    # Sections where everything on at once is the point.
    allow_sections: [finale]
